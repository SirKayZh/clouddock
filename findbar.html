<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <title>findbar</title>
  <style>
    :root { --blue: #0052D9; --line: #E6EBF3; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; font-size: 13px; color: #1C2438; user-select: none; }
    #bar {
      display: flex; align-items: center; gap: 4px; width: 100%; height: 100%; padding: 5px 6px 5px 10px;
      background: #fff; border-radius: 10px;
      border: 1px solid rgba(15, 37, 74, .08);
      box-shadow: 0 8px 24px rgba(15, 37, 74, .18), 0 1px 4px rgba(15, 37, 74, .08);
      animation: pop .12s ease-out; transform-origin: top right;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    #q {
      flex: 1; min-width: 0; height: 100%; border: none; outline: none; background: transparent;
      font: inherit; color: #1C2438; user-select: text;
    }
    #q::placeholder { color: #A8B2C5; }
    #count { flex: none; min-width: 40px; text-align: center; font-size: 12px; color: #8A94A8; }
    #count.none { color: #D54941; }
    .btn {
      flex: none; width: 30px; height: 30px; border: none; background: transparent; border-radius: 7px;
      cursor: pointer; font: inherit; font-size: 14px; color: #5A6B88; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .btn:hover { background: #F1F5FB; color: var(--blue); }
  </style>
</head>
<body>
  <div id="bar">
    <input id="q" type="text" placeholder="在页面中查找" spellcheck="false">
    <span id="count"></span>
    <button id="prev" class="btn" title="上一个 (Shift+Enter)">‹</button>
    <button id="next" class="btn" title="下一个 (Enter)">›</button>
    <button id="close" class="btn" title="关闭 (Esc)">×</button>
  </div>
  <script src="findbar.js"></script>
</body>
</html>
