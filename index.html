<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <title>WorkPier — 网页工作台</title>
  <style>
    :root {
      --blue: #0052D9;
      --blue-light: #E8F0FF;
      --bg: #F5F7FA;
      --line: #E3E8F0;
      --text: #1C2438;
      --sub: #8A94A8;
      /* 企业微信风格：浅蓝侧栏 + 白色选中块 + 圆角方形头像 */
      --rail: #D6E6F8;
      --rail-line: #C4D9F0;
      --rail-hover: rgba(255, 255, 255, .5);
      --rail-sel: #FFFFFF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      font-size: 13px; color: var(--text); background: var(--bg);
    }
    #app { display: flex; width: 100%; height: 100%; }

    /* ---------- 侧边栏 ---------- */
    #sidebar {
      width: 232px; flex: none; background: var(--rail);
      border-right: 1px solid var(--rail-line);
      display: flex; flex-direction: column;
    }
    .sb-header {
      /* 上方 40px 留给 macOS 红绿灯，品牌放在红绿灯下面 */
      height: 84px; flex: none; display: flex; align-items: center;
      padding: 38px 14px 0 16px;
      -webkit-app-region: drag;
    }
    .sb-brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .sb-logo { width: 26px; height: 26px; flex: none; display: block; }
    .sb-title { font-size: 14px; font-weight: 700; line-height: 1.2; white-space: nowrap; letter-spacing: .2px; }
    .sb-title span { display: block; font-size: 10px; font-weight: 400; color: #6A82A3; letter-spacing: 0; }
    .sb-list { flex: 1; overflow-y: auto; padding: 6px; }
    .sb-footer { flex: none; padding: 10px; border-top: 1px solid var(--rail-line); }

    /* 工作区（Berth）下拉切换器：常驻「当前工作区」控件，点击展开列表 */
    .sb-berths { flex: none; position: relative; padding: 0 10px 10px; -webkit-app-region: no-drag; }
    .berth-dd {
      display: flex; align-items: center; gap: 6px; width: 100%;
      height: 30px; padding: 0 8px; border-radius: 8px;
      border: 1px solid var(--rail-line); background: #fff;
      font-size: 12px; color: #44526B; cursor: pointer; user-select: none;
    }
    .berth-dd:hover { border-color: #B9C8E0; background: var(--rail-hover); }
    .berth-dd.open { border-color: var(--blue); }
    .berth-dd .berth-dd-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .berth-dd .berth-dd-caret { flex: none; font-size: 10px; color: #8296B5; transition: transform .15s; }
    .berth-dd.open .berth-dd-caret { transform: rotate(180deg); }
    .berth-dd-panel {
      position: absolute; top: 100%; left: 0; margin-top: 4px; z-index: 50;
      width: 100%; max-height: 300px; overflow-y: auto; overscroll-behavior: contain;
      background: #fff; border: 1px solid var(--rail-line); border-radius: 10px;
      box-shadow: 0 8px 24px rgba(15, 37, 74, .14); padding: 4px;
    }
    .berth-dd-item {
      display: flex; align-items: center; gap: 7px; width: 100%;
      height: 30px; padding: 0 8px; border-radius: 7px;
      font-size: 12px; color: #44526B; cursor: pointer; user-select: none;
      border: none; background: transparent; text-align: left;
    }
    .berth-dd-item:hover { background: var(--rail-hover); }
    .berth-dd-item.active { color: var(--blue); font-weight: 600; }
    .berth-dd-item .berth-dd-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .berth-dd-item .berth-dd-check { flex: none; width: 14px; font-size: 11px; color: var(--blue); visibility: hidden; }
    .berth-dd-item.active .berth-dd-check { visibility: visible; }
    .berth-dd-new {
      display: flex; align-items: center; gap: 7px; width: 100%;
      height: 30px; padding: 0 8px; margin-top: 2px;
      border: none; border-top: 1px solid var(--rail-line); border-radius: 0 0 7px 7px;
      font-size: 12px; color: #8296B5; cursor: pointer; user-select: none; background: transparent;
      text-align: left;
    }
    .berth-dd-new:hover { background: var(--rail-hover); color: var(--blue); }
    .berth-new-input {
      height: 28px; padding: 0 8px; border-radius: 7px;
      border: 1px solid var(--blue); outline: none;
      font-size: 12px; width: 100%; margin: 2px 0;
    }

    .acc-item {
      display: flex; align-items: center; gap: 10px;
      height: 48px; padding: 0 10px; border-radius: 10px;
      cursor: pointer; user-select: none; position: relative;
    }
    .acc-item:hover { background: var(--rail-hover); }
    .acc-item.active { background: var(--rail-sel); box-shadow: 0 1px 3px rgba(40, 90, 160, .12); }
    .acc-item.active .acc-name { color: var(--blue); }
    .acc-avatar {
      width: 30px; height: 30px; border-radius: 8px; flex: none;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 13px; font-weight: 700;
    }
    .acc-label { display: none; }
    .acc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .acc-name {
      font-size: 13px; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .acc-note {
      font-size: 11px; color: var(--sub); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .acc-hint {
      flex: none; font-size: 10px; color: #7E93B0; background: rgba(255, 255, 255, .65);
      border-radius: 4px; padding: 1px 5px;
    }
    .acc-del {
      display: none; flex: none; font-size: 11px; color: #C2CBD9;
      padding: 3px 5px; border-radius: 4px;
    }
    .acc-del:hover { color: #E54545; background: #FDECEC; }
    .acc-item:hover .acc-del { display: inline; }
    .acc-item:hover .acc-hint { display: none; }
    .rename-input {
      flex: 1; min-width: 0; height: 26px; border: 1px solid var(--blue);
      border-radius: 6px; padding: 0 6px; font-size: 13px; outline: none;
      /* 父级 .acc-item 是 user-select:none，必须显式放开，否则输入法无法组字 */
      -webkit-user-select: text; user-select: text; -webkit-app-region: no-drag;
    }
    .acc-more {
      display: none; flex: none; font-size: 13px; line-height: 1; color: #98A2B8;
      padding: 3px 5px; border-radius: 4px; letter-spacing: 1px;
    }
    .acc-more:hover { color: var(--blue); background: #E6EFFB; }
    .acc-item:hover .acc-more { display: inline; }
    .add-mini { display: none; }

    /* ---------- 侧边栏收起（窄栏只显示头像，宽度须与主进程 RAIL_W=88 一致） ---------- */
    #sidebar { transition: none; }
    body.collapsed #sidebar { width: 88px; }
    /* 窄栏顶部：app logo 恢复显示（仅 logo，标题隐藏），整体上移让账号区更靠上 */
    body.collapsed .sb-header { height: 62px; padding: 34px 0 0; justify-content: center; }
    body.collapsed .sb-title,
    body.collapsed .acc-info,
    body.collapsed .acc-hint,
    body.collapsed .acc-del,
    body.collapsed .acc-more,
    body.collapsed .sb-tip,
    body.collapsed .add-full { display: none !important; }
    body.collapsed .add-mini { display: inline; font-size: 16px; }
    /* 拖拽排序视觉反馈：半透明源项 + 上/下边缘蓝色插入线 */
    .acc-item.dragging { opacity: .35; }
    .acc-item.drop-before { box-shadow: inset 0 2px 0 var(--blue); }
    .acc-item.drop-after { box-shadow: inset 0 -2px 0 var(--blue); }
    /* 窄栏：圆角方形头像居中，名字缩小显示在下方（企业微信一样） */
    body.collapsed .acc-item {
      flex-direction: column; justify-content: center; gap: 4px;
      height: auto; padding: 7px 0 6px; margin: 1px 5px; border-radius: 12px;
    }
    /* 选中态：去掉大卡片背景，改为贴栏左缘的蓝色竖条（企微风格，干净利落） */
    body.collapsed .acc-item.active { background: transparent; box-shadow: none; }
    body.collapsed .acc-item.active::before {
      content: ''; position: absolute; left: -5px; top: 50%; transform: translateY(-50%);
      width: 3px; height: 24px; border-radius: 2px; background: var(--blue);
    }
    body.collapsed .acc-avatar { width: 36px; height: 36px; font-size: 14px; border-radius: 9px; }
    body.collapsed .acc-label {
      display: block; max-width: 100%; padding: 0 2px; font-size: 11px; color: #44526B;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center;
    }
    body.collapsed .acc-item.active .acc-label { color: var(--blue); font-weight: 600; }
    body.collapsed .sb-list { padding: 4px 0; }
    body.collapsed .sb-footer { padding: 10px; }
    /* 工作区控件不显示 icon（节省空间，用户要求）：只显示名字 */
    .berth-dd > span:first-child { display: none; }
    /* 工作区不显示 emoji icon（用户要求，展开/收起两态统一）：触发器与面板条目都只留名字 */
    .berth-dd > span:first-child,
    .berth-dd-item > span:first-child { display: none; }
    /* 展开态触发器：同样的淡蓝胶囊（名字居左 + ▾ 靠右），与收起态一脉相承 */
    body:not(.collapsed) .berth-dd { height: 32px; border: none; background: rgba(0, 82, 217, .09); border-radius: 10px; padding: 0 12px; }
    body:not(.collapsed) .berth-dd:hover { background: rgba(0, 82, 217, .15); }
    body:not(.collapsed) .berth-dd.open { background: rgba(0, 82, 217, .2); }
    body:not(.collapsed) .berth-dd .berth-dd-name { color: var(--blue); }
    body:not(.collapsed) .berth-dd .berth-dd-caret { color: var(--blue); opacity: .75; }
    body:not(.collapsed) .berth-dd-panel { top: 38px; margin-top: 0; }
    body:not(.collapsed) .berth-dd-item.active { background: #E9F0FD; }
    /* 窄栏：工作区切换器 = 淡蓝胶囊（名字 + ▾ 箭头，一眼可辨可点）+ 下方细分隔线，
       把「工作区」与「账号列表」分成两层，不再是一行漂浮文字 */
    body.collapsed .sb-berths { padding: 4px 10px 12px; margin-bottom: 4px; }
    body.collapsed .sb-berths::after {
      content: ''; position: absolute; left: 18px; right: 18px; bottom: 0;
      height: 1px; background: var(--rail-line);
    }
    /* 触发器：按内容收缩、居中的小标签（与 26px logo / 36px 头像同一视觉量级），
       名字允许换行，不再被省略 */
    body.collapsed .berth-dd {
      flex-direction: row; justify-content: center; align-items: center; gap: 3px;
      width: fit-content; max-width: 100%; min-width: 52px; margin: 0 auto;
      height: auto; min-height: 24px; padding: 3px 9px; border-radius: 8px;
      border: none; background: rgba(0, 82, 217, .09);
    }
    body.collapsed .berth-dd:hover { background: rgba(0, 82, 217, .15); }
    body.collapsed .berth-dd.open { background: rgba(0, 82, 217, .2); }
    body.collapsed .berth-dd .berth-dd-name {
      flex: 0 1 auto; min-width: 0; font-size: 12px; font-weight: 600; color: var(--blue);
      line-height: 1.3; white-space: normal; word-break: break-all; overflow: visible; text-overflow: clip; text-align: center;
    }
    body.collapsed .berth-dd .berth-dd-caret { display: inline; font-size: 8px; color: var(--blue); opacity: .75; }
    /* 收起态：面板 = 窄栏内 macOS 菜单风格。窄栏仅 88px，所以去掉 ✓ 占位列、
       选中项用浅蓝底+蓝色粗体表示，名字整行显示、过长自动换行（不省略） */
    body.collapsed .berth-dd-panel {
      left: 4px; right: 4px; width: auto; top: calc(100% - 8px); margin-top: 0; padding: 4px; border-radius: 12px;
      overflow-x: hidden; box-shadow: 0 10px 32px rgba(15, 37, 74, .2);
    }
    body.collapsed .berth-dd-item {
      justify-content: center; gap: 0; height: auto; min-height: 30px; padding: 6px 4px; border-radius: 8px;
    }
    body.collapsed .berth-dd-item.active { background: #E9F0FD; }
    body.collapsed .berth-dd-item .berth-dd-check { display: none; }
    body.collapsed .berth-dd-item .berth-dd-item-name {
      flex: 1 1 auto; text-align: center; font-weight: 500; line-height: 1.3;
      white-space: normal; word-break: break-all; overflow: visible; text-overflow: clip;
    }
    body.collapsed .berth-dd-item.active .berth-dd-item-name { font-weight: 600; }
    body.collapsed .berth-dd-new { justify-content: center; padding: 6px 4px; height: auto; min-height: 30px; border-top: none; margin-top: 4px; border-radius: 8px; white-space: normal; }

    .add-btn {
      width: 100%; height: 36px; border: none;
      border-radius: 10px; background: rgba(255, 255, 255, .7); color: var(--blue);
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .add-btn:hover { background: #fff; }
    .add-form { display: flex; flex-direction: column; gap: 8px; }
    .add-input {
      height: 32px; border: 1px solid var(--line); border-radius: 8px;
      padding: 0 10px; font-size: 13px; outline: none; background: #fff;
    }
    .add-input:focus { border-color: var(--blue); }
    .add-actions { display: flex; gap: 8px; }
    .btn {
      height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; font-size: 12px; cursor: pointer; color: var(--text);
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: #0665E8; }
    .sb-tip { margin-top: 8px; text-align: center; font-size: 10px; color: #7E93B0; }

    /* ---------- 主区域 ---------- */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    #toolbar {
      height: 52px; flex: none; display: flex; align-items: center; gap: 6px;
      padding: 10px 12px 0 12px;
      -webkit-app-region: drag;
    }
    #toolbar button, #toolbar input { -webkit-app-region: no-drag; }
    .tb-btn {
      width: 32px; height: 32px; flex: none; border: none; border-radius: 8px;
      background: transparent; font-size: 17px; color: #444E63; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .tb-btn:hover:not(:disabled) { background: #E9EFF9; }
    /* 去掉系统默认的橙色焦点环；键盘聚焦时用浅蓝底代替 */
    button { outline: none; }
    button:focus, button:focus-visible { outline: none; box-shadow: none; }
    .tb-btn:focus-visible { background: #E9EFF9; }
    .tb-btn svg { width: 18px; height: 18px; }
    .tb-btn:disabled { opacity: 0.35; cursor: default; }
    #urlInput {
      flex: 1; height: 32px; min-width: 0; border: 1px solid var(--line);
      border-radius: 16px; padding: 0 14px; font-size: 12px; color: #333;
      background: #fff; outline: none;
    }
    #urlInput:focus { border-color: var(--blue); }
    #activeBadge {
      flex: none; display: flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 12px; border-radius: 14px;
      background: var(--blue-light); color: var(--blue);
      font-size: 12px; font-weight: 600; max-width: 180px; white-space: nowrap;
      overflow: hidden;
    }
    #activeBadge .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #A6B0C3; }
    .badge-none { font-weight: 400; color: var(--sub); }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    #content { flex: 1; position: relative; }

    /* ---------- 保存登录信息提示条（高度须与主进程 BANNER_H=56 一致）：蓝底白字，保存=蓝，更新密码=橙 ---------- */
    #banner {
      height: 56px; flex: none; display: none; align-items: center; gap: 12px;
      padding: 0 16px; background: #0052D9; color: #fff; font-size: 13px;
      box-shadow: 0 2px 10px rgba(0, 40, 120, .35); position: relative; z-index: 5;
      animation: bn-in .28s ease-out;
    }
    #banner.update { background: #D9730D; box-shadow: 0 2px 10px rgba(140, 60, 0, .35); }
    @keyframes bn-in { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }
    #banner .bn-icon {
      flex: none; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .22);
      display: flex; align-items: center; justify-content: center; font-size: 17px;
    }
    #banner .bn-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    #banner .bn-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #banner .bn-sub { font-size: 12px; opacity: .88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #banner .btn { height: 32px; padding: 0 16px; font-size: 13px; border-radius: 6px; }
    #banner .btn.primary { background: #fff; color: #0052D9; border: none; font-weight: 600; }
    #banner.update .btn.primary { color: #B85C00; }
    #banner .btn.primary:hover { background: #EAF1FF; }
    #banner .btn.ghost { background: rgba(255, 255, 255, .18); color: #fff; border: none; }
    #banner .btn.ghost:hover { background: rgba(255, 255, 255, .3); }
    #banner .btn.link { border: none; background: transparent; color: rgba(255, 255, 255, .85); padding: 0 8px; }
    #banner .btn.link:hover { color: #fff; text-decoration: underline; }

    /* ---------- 标签栏 ---------- */
    #tabbar {
      height: 36px; flex: none; display: flex; align-items: center;
      gap: 4px; padding: 4px 8px 0 8px;
      background: var(--bg); border-bottom: 1px solid var(--line);
      -webkit-app-region: drag;
    }
    #tabbar .tab, #tabbar .tab-new { -webkit-app-region: no-drag; }
    #tablist {
      display: flex; align-items: flex-end; gap: 4px;
      flex: 0 1 auto; overflow-x: auto; height: 100%;
    }
    #tablist::-webkit-scrollbar { height: 0; }
    .tab {
      display: flex; align-items: center; gap: 6px;
      height: 31px; min-width: 90px; max-width: 200px; flex: 0 1 auto;
      padding: 0 8px 0 12px; border-radius: 8px 8px 0 0;
      background: #E7ECF4; cursor: pointer; user-select: none;
      font-size: 12px; color: #444E63;
    }
    .tab:hover { background: #EDF1F8; }
    .tab.active { background: #fff; color: var(--blue); font-weight: 600; }
    .tab-title {
      flex: 1; min-width: 0; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .tab-close {
      display: flex; align-items: center; justify-content: center;
      width: 16px; height: 16px; border-radius: 4px; flex: none;
      font-size: 10px; color: transparent;
    }
    .tab:hover .tab-close { color: #98A2B8; }
    .tab-close:hover { color: #E54545 !important; background: #FDECEC; }
    .tab-new {
      width: 28px; height: 26px; flex: none; border: none; border-radius: 6px;
      background: transparent; font-size: 16px; color: #444E63; cursor: pointer;
    }
    .tab-new:hover { background: #E9EFF9; }

    #empty {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
    }
    .empty-card { text-align: center; max-width: 480px; padding: 24px; }
    .empty-icon { font-size: 44px; margin-bottom: 16px; }
    .empty-card h1 { font-size: 20px; margin-bottom: 10px; }
    .empty-card p { font-size: 13px; color: var(--sub); line-height: 1.7; margin-bottom: 20px; }
    .empty-card .btn.primary { height: 36px; padding: 0 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sb-header">
        <div class="sb-brand">
          <svg class="sb-logo" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#0052D9"/>
            <g fill="#fff" fill-opacity=".4" transform="translate(2.6 -2.6)"><circle cx="17" cy="15" r="4.4"/><circle cx="12.6" cy="16.8" r="3"/><circle cx="21.6" cy="17" r="2.6"/><rect x="10" y="16.2" width="14" height="4.4" rx="2.2"/></g>
            <g fill="#fff"><circle cx="17" cy="15" r="4.4"/><circle cx="12.6" cy="16.8" r="3"/><circle cx="21.6" cy="17" r="2.6"/><rect x="10" y="16.2" width="14" height="4.4" rx="2.2"/></g>
          </svg>
          <div class="sb-title">WorkPier<span>网页工作台</span></div>
        </div>
      </div>
      <div id="berthBar" class="sb-berths"></div>
      <div id="accountList" class="sb-list"></div>
      <div id="sbFooter" class="sb-footer">
        <button id="btnAdd" class="add-btn" title="添加账号"><span class="add-full">＋ 添加账号</span><span class="add-mini">＋</span></button>
        <div class="sb-tip">⌘1~9 切换 · ⌘B 收起 · 右键账号：改名 / 清除 Cookie</div>
      </div>
    </aside>
    <main id="main">
      <div id="toolbar">
        <button id="sbToggle" class="tb-btn" title="收起 / 展开侧边栏 (⌘B)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="9.5" y1="4" x2="9.5" y2="20"/></svg>
        </button>
        <button id="navBack" class="tb-btn" title="后退 (⌘[)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="14.5 6 8.5 12 14.5 18"/></svg></button>
        <button id="navFwd" class="tb-btn" title="前进 (⌘])"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="9.5 6 15.5 12 9.5 18"/></svg></button>
        <button id="navReload" class="tb-btn" title="刷新 (⌘R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5"/><polyline points="19.8 4.2 19.5 8.6 15.1 8.3"/></svg></button>
        <button id="navHome" class="tb-btn" title="账号首页"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.2 12 4.5l8 6.7"/><path d="M6 10.2V19a1 1 0 0 0 1 1h3.5v-5h3v5H17a1 1 0 0 0 1-1v-8.8"/></svg></button>
        <input id="urlInput" placeholder="输入网址或搜索内容" spellcheck="false">
        <div id="activeBadge"></div>
      </div>
      <div id="tabbar" style="display:none">
        <div id="tablist"></div>
        <button id="tabNew" class="tab-new" title="新建标签页 (⌘T)">＋</button>
      </div>
      <div id="banner"></div>
      <div id="content">
        <div id="empty">
          <div class="empty-card">
            <div class="empty-icon">☁️</div>
            <h1>多账号浏览器</h1>
            <p>每个账号拥有完全独立的浏览器会话（Cookie / 缓存隔离），<br>
               点「添加账号」会新建一个独立会话，在里面登录任意网站（腾讯云、GitHub、阿里云……），<br>
               登录后自动命名，之后点击侧边栏秒级切换，无需退出再重新登录。</p>
            <button id="btnAddEmpty" class="btn primary">＋ 添加第一个账号</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
