<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
  <title>CloudDock — 腾讯云多账号工作台</title>
  <style>
    :root {
      --blue: #0052D9;
      --blue-light: #E8F0FF;
      --bg: #F5F7FA;
      --line: #E3E8F0;
      --text: #1C2438;
      --sub: #8A94A8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
      font-size: 13px; color: var(--text); background: var(--bg);
    }
    #app { display: flex; width: 100%; height: 100%; }

    /* ---------- 侧边栏 ---------- */
    #sidebar {
      width: 232px; flex: none; background: #fff;
      border-right: 1px solid var(--line);
      display: flex; flex-direction: column;
    }
    .sb-header {
      height: 52px; flex: none; display: flex; align-items: center;
      padding-left: 84px; padding-right: 12px;
      -webkit-app-region: drag;
    }
    .sb-title { font-size: 14px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
    .sb-title span { display: block; font-size: 10px; font-weight: 400; color: var(--sub); }
    .sb-list { flex: 1; overflow-y: auto; padding: 6px; }
    .sb-footer { flex: none; padding: 10px; border-top: 1px solid var(--line); }

    .acc-item {
      display: flex; align-items: center; gap: 8px;
      height: 46px; padding: 0 8px; border-radius: 8px;
      cursor: pointer; user-select: none; position: relative;
    }
    .acc-item:hover { background: #F2F5FB; }
    .acc-item.active { background: var(--blue-light); }
    .acc-item.active .acc-name { color: var(--blue); }
    .acc-avatar {
      width: 26px; height: 26px; border-radius: 50%; flex: none;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 12px; font-weight: 700;
    }
    .acc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .acc-name {
      font-size: 13px; font-weight: 600; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .acc-note {
      font-size: 11px; color: var(--sub); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .acc-hint {
      flex: none; font-size: 10px; color: #A6B0C3; background: #F2F5FB;
      border-radius: 4px; padding: 1px 5px;
    }
    .acc-del {
      display: none; flex: none; font-size: 11px; color: #C2CBD9;
      padding: 3px 5px; border-radius: 4px;
    }
    .acc-del:hover { color: #E54545; background: #FDECEC; }
    .acc-item:hover .acc-del { display: inline; }
    .acc-item:hover .acc-hint { display: none; }
    .rename-input {
      flex: 1; min-width: 0; height: 26px; border: 1px solid var(--blue);
      border-radius: 6px; padding: 0 6px; font-size: 13px; outline: none;
    }

    .add-btn {
      width: 100%; height: 34px; border: 1px dashed var(--blue);
      border-radius: 8px; background: transparent; color: var(--blue);
      font-size: 13px; cursor: pointer;
    }
    .add-btn:hover { background: var(--blue-light); }
    .add-form { display: flex; flex-direction: column; gap: 8px; }
    .add-input {
      height: 32px; border: 1px solid var(--line); border-radius: 8px;
      padding: 0 10px; font-size: 13px; outline: none; background: #fff;
    }
    .add-input:focus { border-color: var(--blue); }
    .add-actions { display: flex; gap: 8px; }
    .btn {
      height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);
      background: #fff; font-size: 12px; cursor: pointer; color: var(--text);
    }
    .btn:hover { border-color: var(--blue); color: var(--blue); }
    .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn.primary:hover { background: #0665E8; }
    .sb-tip { margin-top: 8px; text-align: center; font-size: 10px; color: #A6B0C3; }

    /* ---------- 主区域 ---------- */
    #main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
    #toolbar {
      height: 52px; flex: none; display: flex; align-items: center; gap: 6px;
      padding: 10px 12px 0 12px;
      -webkit-app-region: drag;
    }
    #toolbar button, #toolbar input { -webkit-app-region: no-drag; }
    .tb-btn {
      width: 32px; height: 32px; flex: none; border: none; border-radius: 8px;
      background: transparent; font-size: 17px; color: #444E63; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .tb-btn:hover:not(:disabled) { background: #E9EFF9; }
    .tb-btn:disabled { opacity: 0.35; cursor: default; }
    #urlInput {
      flex: 1; height: 32px; min-width: 0; border: 1px solid var(--line);
      border-radius: 16px; padding: 0 14px; font-size: 12px; color: #333;
      background: #fff; outline: none;
    }
    #urlInput:focus { border-color: var(--blue); }
    #activeBadge {
      flex: none; display: flex; align-items: center; gap: 6px;
      height: 28px; padding: 0 12px; border-radius: 14px;
      background: var(--blue-light); color: var(--blue);
      font-size: 12px; font-weight: 600; max-width: 180px; white-space: nowrap;
      overflow: hidden;
    }
    #activeBadge .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #A6B0C3; }
    .badge-none { font-weight: 400; color: var(--sub); }
    .spin { display: inline-block; animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    #content { flex: 1; position: relative; }
    #empty {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
    }
    .empty-card { text-align: center; max-width: 480px; padding: 24px; }
    .empty-icon { font-size: 44px; margin-bottom: 16px; }
    .empty-card h1 { font-size: 20px; margin-bottom: 10px; }
    .empty-card p { font-size: 13px; color: var(--sub); line-height: 1.7; margin-bottom: 20px; }
    .empty-card .btn.primary { height: 36px; padding: 0 20px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sb-header">
        <div class="sb-title">☁️ CloudDock<span>腾讯云多账号工作台</span></div>
      </div>
      <div id="accountList" class="sb-list"></div>
      <div id="sbFooter" class="sb-footer">
        <button id="btnAdd" class="add-btn">＋ 添加账号</button>
        <div class="sb-tip">⌘1~9 快速切换 · 双击重命名</div>
      </div>
    </aside>
    <main id="main">
      <div id="toolbar">
        <button id="navBack" class="tb-btn" title="后退 (⌘[)">‹</button>
        <button id="navFwd" class="tb-btn" title="前进 (⌘])">›</button>
        <button id="navReload" class="tb-btn" title="刷新 (⌘R)">⟳</button>
        <button id="navHome" class="tb-btn" title="控制台首页">⌂</button>
        <input id="urlInput" placeholder="https://console.cloud.tencent.com/" spellcheck="false">
        <div id="activeBadge"></div>
      </div>
      <div id="content">
        <div id="empty">
          <div class="empty-card">
            <div class="empty-icon">☁️</div>
            <h1>腾讯云多账号工作台</h1>
            <p>每个账号拥有完全独立的浏览器会话（Cookie / 缓存隔离），<br>
               各自登录一次即可长期保持，点击侧边栏秒级切换，<br>
               无需退出登录再重新登录。</p>
            <button id="btnAddEmpty" class="btn primary">＋ 添加第一个账号</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
